# Path: src/main/resources/application.properties
spring.datasource.url=jdbc:mysql://localhost:3306/ticketbox_db
spring.datasource.username=ticketbox_user
spring.datasource.password=ticketbox_password

spring.main.banner-mode=off
logging.level.root=warn

# C03L10-01: Hibernate tự xóa rồi tạo lại bảng của các Entity mỗi lần khởi động (MẤT TOÀN BỘ DỮ LIỆU)
# Tạo Bảng lại, mất toàn lại dữ liệu
spring.jpa.hibernate.ddl-auto=create

# In ra câu lệnh SQL (bao gồm DDL) và giá trị tham số
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
